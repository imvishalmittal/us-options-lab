name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run checks and tests
        run: npm run ci
      - name: Compile QuantConnect research package
        run: python -m py_compile quantconnect/strategy_core.py quantconnect/main.py
      - name: Run Python research tests
        run: python -m unittest discover -s test_python -p 'test_*.py'
